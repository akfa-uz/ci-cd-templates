name: Build & Deploy to Server (Reusable)
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name for GHCR"
        required: true
        type: string
      service_name:
        description: "Service name for deployment"
        required: true
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build-and-push.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Set image tag (short commit)
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin
        #Create .npmrc for GitHub Packages
      - name: Create .npmrc
        run: |
          cat > .npmrc <<EOF
          @akfa-uz:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          
      - name: Build and Push Docker Image
        run: |
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          docker build -t $IMAGE .
          docker push $IMAGE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  deploy:
    runs-on: ${{
      github.ref_name == 'main' && 'prod-pillpack' ||
      github.ref_name == 'master' && 'prod-pillpack' ||
      github.ref_name == 'dev' && 'dev-pillpack'
      }}
    needs: build-and-push
    # A deploy that has not converged in 20 minutes is stuck (swarm keeps restarting a
    # task that cannot start); GitHub ends the job so the runner is free for the next push.
    timeout-minutes: 20
    steps:
      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin

      - name: Deploy to Production
        run: |
          # GitHub runs this under `bash -e`: a failing command ends the step at once, so
          # the diagnostics are printed BEFORE the update (the previous attempt's task
          # state and container log) and the update itself runs inside an if/else.
          set -uo pipefail
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          SERVICE="${{ inputs.service_name }}"

          # `docker service logs` hangs when the service has a trail of dead tasks (it did,
          # for 20 minutes, three times on 2026-11-18), so the diagnostics read the task
          # list and the containers on THIS node directly, each call bounded.
          diagnostics() {
            echo "::group::docker service ps $SERVICE ($1)"
            timeout 30s docker service ps "$SERVICE" --no-trunc 2>&1 | head -12 || true
            echo "::endgroup::"
            echo "::group::container logs on this node — last 120 lines of the 2 newest ($1)"
            for c in $(timeout 15s docker ps -a --filter "name=$SERVICE" --format '{{.ID}}' 2>/dev/null | head -2); do
              echo "--- container $c: $(timeout 10s docker inspect -f '{{.Config.Image}} | {{.State.Status}} | exit {{.State.ExitCode}} | started {{.State.StartedAt}}' "$c" 2>/dev/null)"
              timeout 20s docker logs --tail 120 "$c" 2>&1 | grep -v "npm notice" || true
            done
            echo "::endgroup::"
          }

          diagnostics "before update"
          timeout 5m docker pull "$IMAGE"

          # start-first: the new task starts next to the old one; the old one is stopped
          # only once the new one is healthy (HEALTHCHECK on /health). On failure swarm
          # rolls back to the previous spec in the same order.
          # A new task that crash-loops can keep `--detach=false` monitoring for a very
          # long time (35+ min seen on 2026-11-18); bound it so the step always ends and
          # the diagnostics below are always printed.
          # Fail fast: the new task gets 3 starts within 3 minutes (restart policy); the
          # update watches every task failure for 30 s after start (monitor, max failure
          # ratio 0) and rolls back on the first one. A task that cannot come up therefore
          # fails the step in a few minutes instead of being restarted forever; `timeout`
          # is only the last resort.
          if timeout 6m docker service update \
            --force \
            --with-registry-auth \
            --detach=false \
            --restart-condition on-failure \
            --restart-max-attempts 3 \
            --restart-delay 5s \
            --restart-window 3m \
            --update-order start-first \
            --update-failure-action rollback \
            --update-max-failure-ratio 0 \
            --update-monitor 30s \
            --rollback-order start-first \
            --rollback-failure-action pause \
            --image "$IMAGE" \
            "$SERVICE"; then
            STATUS=0
          else
            STATUS=$?
          fi

          diagnostics "after update (exit $STATUS)"

          RUNNING=$(docker service ps "$SERVICE" --filter desired-state=running --format '{{.Image}} {{.CurrentState}}' || true)
          echo "running: $RUNNING"
          if [ "$STATUS" -ne 0 ]; then
            [ "$STATUS" -eq 124 ] && echo "::error::docker service update did not converge within 6 minutes; see the log groups above" \
              || echo "::error::docker service update exited $STATUS — the new task did not start; see the log groups above"
            exit 1
          fi
          case "$RUNNING" in
            *"$IMAGE"*Running*) echo "deploy ok: $SERVICE is running $IMAGE" ;;
            *) echo "::error::$SERVICE is not running $IMAGE"; exit 1 ;;
          esac
          docker container prune -f
