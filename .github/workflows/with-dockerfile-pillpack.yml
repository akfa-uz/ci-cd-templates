name: Build & Deploy to Server (Reusable)
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name for GHCR"
        required: true
        type: string
      service_name:
        description: "Service name for deployment"
        required: true
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-and-push.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Set image tag (short commit)
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin
        #Create .npmrc for GitHub Packages
      - name: Create .npmrc
        run: |
          cat > .npmrc <<EOF
          @akfa-uz:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          
      - name: Build and Push Docker Image
        run: |
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          docker build -t $IMAGE .
          docker push $IMAGE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  deploy:
    runs-on: ${{
      github.ref_name == 'main' && 'prod-pillpack' ||
      github.ref_name == 'master' && 'prod-pillpack' ||
      github.ref_name == 'dev' && 'dev-pillpack'
      }}
    needs: build-and-push
    steps:
      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin

      - name: Deploy to Production
        run: |
          # GitHub runs this under `bash -e`: a failing command ends the step at once, so
          # the diagnostics are printed BEFORE the update (the previous attempt's task
          # state and container log) and the update itself runs inside an if/else.
          set -uo pipefail
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          SERVICE="${{ inputs.service_name }}"

          diagnostics() {
            echo "::group::docker service ps $SERVICE ($1)"
            docker service ps "$SERVICE" --no-trunc | head -12 || true
            echo "::endgroup::"
            echo "::group::docker service logs $SERVICE — last 150 lines ($1)"
            docker service logs "$SERVICE" --tail 150 2>&1 | tail -150 || true
            echo "::endgroup::"
          }

          diagnostics "before update"
          docker pull "$IMAGE"

          # start-first: the new task starts next to the old one; the old one is stopped
          # only once the new one is healthy (HEALTHCHECK on /health). On failure swarm
          # rolls back to the previous spec in the same order.
          # A new task that crash-loops can keep `--detach=false` monitoring for a very
          # long time (35+ min seen on 2026-11-18); bound it so the step always ends and
          # the diagnostics below are always printed.
          if timeout 12m docker service update \
            --force \
            --with-registry-auth \
            --detach=false \
            --update-order start-first \
            --update-failure-action rollback \
            --update-monitor 60s \
            --rollback-order start-first \
            --image "$IMAGE" \
            "$SERVICE"; then
            STATUS=0
          else
            STATUS=$?
          fi

          diagnostics "after update (exit $STATUS)"

          RUNNING=$(docker service ps "$SERVICE" --filter desired-state=running --format '{{.Image}} {{.CurrentState}}' || true)
          echo "running: $RUNNING"
          if [ "$STATUS" -ne 0 ]; then
            [ "$STATUS" -eq 124 ] && echo "::error::docker service update did not converge within 12 minutes (new task keeps restarting?); see the log groups above" \
              || echo "::error::docker service update exited $STATUS — the new task did not start; see the log groups above"
            exit 1
          fi
          case "$RUNNING" in
            *"$IMAGE"*Running*) echo "deploy ok: $SERVICE is running $IMAGE" ;;
            *) echo "::error::$SERVICE is not running $IMAGE"; exit 1 ;;
          esac
          docker container prune -f
