name: Build & Deploy to Server (Reusable)
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name for GHCR"
        required: true
        type: string
      service_name:
        description: "Service name for deployment"
        required: true
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-and-push.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Set image tag (short commit)
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin
        #Create .npmrc for GitHub Packages
      - name: Create .npmrc
        run: |
          cat > .npmrc <<EOF
          @akfa-uz:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          
      - name: Build and Push Docker Image
        run: |
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          docker build -t $IMAGE .
          docker push $IMAGE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  deploy:
    runs-on: ${{
      github.ref_name == 'main' && 'prod-pillpack' ||
      github.ref_name == 'master' && 'prod-pillpack' ||
      github.ref_name == 'dev' && 'dev-pillpack'
      }}
    needs: build-and-push
    steps:
      - name: Harbor Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login harbor.agentshub.uz \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin

      - name: Deploy to Production
        run: |
          set -uo pipefail
          IMAGE="harbor.agentshub.uz/ailabcau/${{ inputs.image_name }}:${{ github.sha }}"
          SERVICE="${{ inputs.service_name }}"
          docker pull "$IMAGE"

          # start-first: the new task starts NEXT TO the old one and the old one is
          # stopped only once the new one is healthy (Dockerfile HEALTHCHECK on /health),
          # so a deploy never answers 502 and a broken build never takes the old one down.
          # On failure swarm rolls back to the previous spec, same order.
          docker service update \
            --force \
            --with-registry-auth \
            --detach=false \
            --update-order start-first \
            --update-failure-action rollback \
            --update-monitor 60s \
            --rollback-order start-first \
            --image "$IMAGE" \
            "$SERVICE"
          STATUS=$?

          # Always show what happened — the task list (with the failure reason of a task
          # that died) and the container's own log — whether or not the update succeeded.
          echo "::group::docker service ps $SERVICE"
          docker service ps "$SERVICE" --no-trunc | head -10
          echo "::endgroup::"
          echo "::group::docker service logs $SERVICE (last 150 lines)"
          docker service logs "$SERVICE" --tail 150 2>&1 | tail -150 || true
          echo "::endgroup::"

          RUNNING=$(docker service ps "$SERVICE" --filter desired-state=running --format '{{.Image}} {{.CurrentState}}')
          echo "running: $RUNNING"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::docker service update exited $STATUS — the new task did not start; see the log groups above"
            exit 1
          fi
          case "$RUNNING" in
            *"$IMAGE"*Running*) echo "deploy ok: $SERVICE is running $IMAGE" ;;
            *) echo "::error::$SERVICE is not running $IMAGE"; exit 1 ;;
          esac
          docker container prune -f
